[workspace]
resolver = "2"
members = [
    "crates/ascent-domain",
    "crates/ascent-sim",
    "crates/ascent-aero",
    "crates/ascent-app",
    "crates/ascent-review",
    "crates/ascent-mcp",
    "xtask",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
# MSRV: the toolchain CI builds and tests with. Raising it is a
# deliberate, changelogged decision, not a side effect.
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
approx = "0.5"
