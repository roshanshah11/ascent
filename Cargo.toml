[workspace]
resolver = "2"
members = [
    "crates/ascent-domain",
    "crates/ascent-sim",
    "crates/ascent-aero",
    "crates/ascent-app",
    "crates/ascent-review",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
approx = "0.5"
