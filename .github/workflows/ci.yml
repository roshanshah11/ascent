name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in lockstep with workspace.package.rust-version.
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend dependencies
        run: npm ci
        working-directory: app
      - name: Full gate (Rust tests + typecheck + vitest)
        run: cargo xtask test

  supply-chain:
    name: cargo audit + cargo vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-vet
      - name: Advisory audit
        run: cargo xtask audit
      - name: Supply-chain vet
        run: cargo xtask vet
