# ascent-mcp: MCP stdio adapter over the copilot seam (v0.4, Pillar 3).
#
# Dependency justification: the official MCP Rust SDK supplies protocol
# framing, typed schemas, capability negotiation, Tasks, and stdio transport.
# Only server/macros/transport-io are enabled in production; no HTTP feature,
# listener, or client is present in the shipped binary.
[package]
name = "ascent-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ascent-app = { path = "../ascent-app" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { version = "2.2.0", default-features = false, features = ["client"] }

[[bin]]
name = "ascent-mcp"
path = "src/main.rs"
