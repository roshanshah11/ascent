[package]
name = "ascent-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "ascent_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bridge-rocketpy = ["ascent-sim/bridge-rocketpy"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ascent-domain = { path = "../ascent-domain" }
ascent-sim = { path = "../ascent-sim" }
ascent-aero = { path = "../ascent-aero" }
ascent-review = { path = "../ascent-review" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
